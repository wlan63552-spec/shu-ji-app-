<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的云端书房 - 个人读书笔记</title>
    
    <!-- PWA 与 移动端优化标签 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="云端书房">
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide/book-open.svg?color=%23d97706">
    
    <!-- 引入样式与脚本依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 针对移动端的点击反馈优化 */
        .active-scale:active { transform: scale(0.95); transition: transform 0.1s; }
        
        /* 书本阴影效果 */
        .book-shadow { box-shadow: 2px 4px 8px rgba(0,0,0,0.1), -1px 0 2px rgba(255,255,255,0.2) inset; }
        
        /* Markdown 样式预览微调 */
        .markdown-preview blockquote { border-left: 4px solid #f59e0b; padding-left: 1rem; font-style: italic; color: #6b7280; margin: 1rem 0; }
        .markdown-preview h1 { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
        .markdown-preview h2 { font-size: 1.25rem; font-weight: bold; margin: 0.75rem 0; }
        
        .dark body { background-color: #1A1A1A; }
    </style>
</head>
<body class="bg-[#FDFBF7] transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ----------------------------------------------------------------------
        // 常量配置
        // ----------------------------------------------------------------------
        const BOOK_COLORS = [
            'bg-red-800', 'bg-blue-800', 'bg-emerald-800',
            'bg-amber-700', 'bg-purple-800', 'bg-stone-800',
            'bg-teal-700', 'bg-indigo-800', 'bg-rose-800'
        ];

        // ----------------------------------------------------------------------
        // 图标组件封装
        // ----------------------------------------------------------------------
        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        // ----------------------------------------------------------------------
        // 主应用逻辑
        // ----------------------------------------------------------------------
        function App() {
            // 初始化状态：从本地存储加载
            const [books, setBooks] = useState(() => JSON.parse(localStorage.getItem('cloud-library-books') || '[]'));
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('cloud-library-settings') || '{"yearlyGoal":20, "folders":["默认书单"]}'));
            
            const [currentView, setCurrentView] = useState('shelf');
            const [editingBook, setEditingBook] = useState(null);
            const [editorTab, setEditorTab] = useState('notes');
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterFolder, setFilterFolder] = useState('all');

            // 监听数据持久化
            useEffect(() => { localStorage.setItem('cloud-library-books', JSON.stringify(books)); }, [books]);
            useEffect(() => { localStorage.setItem('cloud-library-settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => {
                const root = window.document.documentElement;
                if (isDarkMode) root.classList.add('dark'); else root.classList.remove('dark');
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            // 统计数据计算
            const stats = useMemo(() => ({
                total: books.length,
                read: books.filter(b => b.status === 'read').length,
                reading: books.filter(b => b.status === 'reading').length,
                totalWords: books.reduce((acc, b) => acc + (b.content?.length || 0), 0)
            }), [books]);

            const handleAddNew = () => {
                setEditingBook({
                    id: Date.now().toString(),
                    title: '', author: '', content: '', quotes: '', 
                    folder: '默认书单', status: 'unread', rating: 0, coverUrl: '',
                    color: BOOK_COLORS[Math.floor(Math.random() * BOOK_COLORS.length)],
                    updatedAt: Date.now()
                });
                setEditorTab('info');
                setCurrentView('editor');
            };

            const handleSave = () => {
                if (!editingBook.title.trim()) return alert("请输入书名");
                const newList = [...books];
                const index = newList.findIndex(b => b.id === editingBook.id);
                if (index > -1) newList[index] = { ...editingBook, updatedAt: Date.now() };
                else newList.unshift({ ...editingBook, updatedAt: Date.now() });
                setBooks(newList);
                setCurrentView('shelf');
            };

            const filteredBooks = books.filter(b => {
                const matchesSearch = b.title.includes(searchQuery) || b.author.includes(searchQuery);
                const matchesFolder = filterFolder === 'all' || b.folder === filterFolder;
                return matchesSearch && matchesFolder;
            });

            // ------------------------------------------------------------------
            // 视图：书架 (Shelf View)
            // ------------------------------------------------------------------
            if (currentView === 'shelf') {
                return (
                    <div className={`min-h-screen ${isDarkMode ? 'bg-[#1A1A1A] text-stone-200' : 'bg-[#FDFBF7] text-stone-800'} p-4 md:p-8`}>
                        <header className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                            <div>
                                <h1 className="text-3xl font-bold flex items-center gap-2">
                                    <Icon name="library" className="text-amber-600" /> 我的云端书房
                                </h1>
                                <p className="text-stone-500 text-sm mt-1">记录感悟，沉淀知识</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 bg-white dark:bg-stone-800 rounded-full shadow-sm border dark:border-stone-700 active-scale">
                                    <Icon name={isDarkMode ? "sun" : "moon"} />
                                </button>
                                <button onClick={() => setCurrentView('stats')} className="p-3 bg-white dark:bg-stone-800 rounded-full shadow-sm border dark:border-stone-700 active-scale">
                                    <Icon name="bar-chart-2" />
                                </button>
                                <button onClick={handleAddNew} className="bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 px-6 py-3 rounded-full font-bold flex items-center shadow-lg active-scale">
                                    <Icon name="plus" className="mr-2" /> 添加新书
                                </button>
                            </div>
                        </header>

                        <div className="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row gap-4 bg-white dark:bg-stone-800 p-4 rounded-3xl shadow-sm border border-stone-100 dark:border-stone-700">
                            <div className="relative flex-1">
                                <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400" />
                                <input 
                                    placeholder="搜索书名或作者..." 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-4 py-2 bg-stone-50 dark:bg-stone-900 border-none rounded-2xl focus:ring-2 focus:ring-amber-500/20" 
                                />
                            </div>
                            <select 
                                value={filterFolder}
                                onChange={e => setFilterFolder(e.target.value)}
                                className="px-4 py-2 bg-stone-50 dark:bg-stone-900 rounded-2xl border-none outline-none text-sm"
                            >
                                <option value="all">全部书单</option>
                                {settings.folders.map(f => <option key={f} value={f}>{f}</option>)}
                            </select>
                        </div>

                        <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 md:gap-10">
                            {filteredBooks.map(book => (
                                <div key={book.id} onClick={() => { setEditingBook(book); setEditorTab('notes'); setCurrentView('editor'); }} className="group cursor-pointer">
                                    <div className={`aspect-[2/3] ${book.coverUrl ? 'bg-stone-200' : book.color} rounded-r-2xl rounded-l shadow-xl mb-4 group-hover:-translate-y-2 transition-all duration-300 relative overflow-hidden book-shadow`}>
                                        {book.coverUrl ? (
                                            <img src={book.coverUrl} className="w-full h-full object-cover" />
                                        ) : (
                                            <div className="p-4 flex flex-col h-full justify-end">
                                                <h3 className="text-white font-bold text-sm leading-tight line-clamp-3 mb-1">{book.title}</h3>
                                                <p className="text-white/60 text-[10px] truncate">{book.author}</p>
                                            </div>
                                        )}
                                        <div className="absolute top-2 right-2">
                                            <span className="text-[10px] font-bold px-2 py-1 bg-black/30 backdrop-blur-md text-white rounded-full">
                                                {book.status === 'read' ? '已读' : book.status === 'reading' ? '在读' : '想读'}
                                            </span>
                                        </div>
                                    </div>
                                    <h4 className="text-sm font-bold truncate px-1">{book.title || "未命名"}</h4>
                                    <p className="text-xs text-stone-500 truncate px-1">{book.author || "未知作者"}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // ------------------------------------------------------------------
            // 视图：编辑器 (Editor View)
            // ------------------------------------------------------------------
            if (currentView === 'editor' && editingBook) {
                return (
                    <div className={`min-h-screen ${isDarkMode ? 'bg-[#1A1A1A]' : 'bg-white'} flex flex-col`}>
                        <nav className="p-4 border-b dark:border-stone-800 flex justify-between items-center sticky top-0 bg-white/80 dark:bg-[#1A1A1A]/80 backdrop-blur-md z-20">
                            <button onClick={() => setCurrentView('shelf')} className="flex items-center text-stone-500 hover:text-stone-900 dark:hover:text-white transition-colors active-scale">
                                <Icon name="chevron-left" className="mr-1" /> 返回
                            </button>
                            <div className="flex gap-2">
                                <button onClick={() => { if(confirm("确定删除？")) { setBooks(books.filter(b => b.id !== editingBook.id)); setCurrentView('shelf'); } }} className="p-2 text-stone-400 hover:text-red-500"><Icon name="trash-2" /></button>
                                <button onClick={handleSave} className="bg-amber-100 text-amber-900 px-6 py-2 rounded-full font-bold shadow-sm hover:bg-amber-200 active-scale flex items-center gap-1">
                                    <Icon name="save" className="w-4 h-4" /> 保存
                                </button>
                            </div>
                        </nav>

                        <div className="flex border-b dark:border-stone-800">
                            <button onClick={() => setEditorTab('notes')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition-colors ${editorTab === 'notes' ? 'text-amber-600 border-amber-600' : 'text-stone-400 border-transparent'}`}>读书笔记</button>
                            <button onClick={() => setEditorTab('quotes')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition-colors ${editorTab === 'quotes' ? 'text-amber-600 border-amber-600' : 'text-stone-400 border-transparent'}`}>金句摘抄</button>
                            <button onClick={() => setEditorTab('info')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition-colors ${editorTab === 'info' ? 'text-amber-600 border-amber-600' : 'text-stone-400 border-transparent'}`}>设置属性</button>
                        </div>

                        <main className="flex-1 max-w-4xl mx-auto w-full p-6 md:p-10">
                            <div className="mb-10">
                                <input 
                                    className={`text-3xl md:text-5xl font-extrabold w-full bg-transparent border-none outline-none mb-3 ${isDarkMode ? 'text-white' : 'text-stone-900'}`} 
                                    placeholder="输入书名..." 
                                    value={editingBook.title}
                                    onChange={e => setEditingBook({...editingBook, title: e.target.value})}
                                />
                                <input 
                                    className="text-lg md:text-xl text-stone-500 w-full bg-transparent border-none outline-none font-medium" 
                                    placeholder="作者" 
                                    value={editingBook.author}
                                    onChange={e => setEditingBook({...editingBook, author: e.target.value})}
                                />
                            </div>

                            {editorTab === 'notes' && (
                                <textarea 
                                    className={`w-full h-[60vh] bg-transparent border-none outline-none text-lg leading-loose font-serif resize-none ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`} 
                                    placeholder="这一刻你在想什么..."
                                    value={editingBook.content}
                                    onChange={e => setEditingBook({...editingBook, content: e.target.value})}
                                />
                            )}

                            {editorTab === 'quotes' && (
                                <div className="relative">
                                    <Icon name="quote" className="w-16 h-16 text-amber-500/10 absolute -top-4 -left-4 -z-0" />
                                    <textarea 
                                        className={`w-full h-[60vh] bg-transparent border-none outline-none text-xl italic font-serif leading-relaxed z-10 relative pt-4 ${isDarkMode ? 'text-stone-400' : 'text-stone-600'}`} 
                                        placeholder="摘抄书中触动灵魂的文字..."
                                        value={editingBook.quotes}
                                        onChange={e => setEditingBook({...editingBook, quotes: e.target.value})}
                                    />
                                    <button onClick={() => downloadPoster(editingBook.quotes, editingBook.title, editingBook.author)} className="mt-4 flex items-center gap-2 bg-stone-100 dark:bg-stone-800 px-4 py-2 rounded-xl text-xs font-bold text-stone-500 active-scale">
                                        <Icon name="camera" className="w-4 h-4" /> 生成分享海报
                                    </button>
                                </div>
                            )}

                            {editorTab === 'info' && (
                                <div className="space-y-8 max-w-md animate-in slide-in-from-bottom-4">
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 uppercase tracking-widest mb-4 block">阅读状态</label>
                                        <div className="flex gap-2">
                                            {['unread', 'reading', 'read'].map(s => (
                                                <button key={s} onClick={() => setEditingBook({...editingBook, status: s})} className={`flex-1 py-3 rounded-2xl text-sm font-bold border-2 transition-all ${editingBook.status === s ? 'bg-amber-500 text-white border-amber-500 shadow-lg' : 'border-stone-200 dark:border-stone-700 text-stone-400'}`}>
                                                    {s === 'unread' ? '想读' : s === 'reading' ? '在读' : '已读'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 uppercase tracking-widest mb-4 block">所属书单</label>
                                        <select value={editingBook.folder} onChange={e => setEditingBook({...editingBook, folder: e.target.value})} className={`w-full p-4 rounded-2xl border-none outline-none shadow-inner ${isDarkMode ? 'bg-stone-800' : 'bg-stone-50'}`}>
                                            {settings.folders.map(f => <option key={f} value={f}>{f}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 uppercase tracking-widest mb-4 block">封面图片 URL (可选)</label>
                                        <input className={`w-full p-4 rounded-2xl border-none outline-none shadow-inner ${isDarkMode ? 'bg-stone-800' : 'bg-stone-50'}`} placeholder="https://图片链接..." value={editingBook.coverUrl || ''} onChange={e => setEditingBook({...editingBook, coverUrl: e.target.value})} />
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                );
            }

            // ------------------------------------------------------------------
            // 视图：统计 (Stats View)
            // ------------------------------------------------------------------
            if (currentView === 'stats') {
                return (
                    <div className={`min-h-screen ${isDarkMode ? 'bg-[#1A1A1A] text-white' : 'bg-[#FDFBF7] text-stone-900'} p-6 md:p-12`}>
                        <header className="max-w-4xl mx-auto flex items-center mb-12">
                            <button onClick={() => setCurrentView('shelf')} className="p-3 bg-white dark:bg-stone-800 rounded-full shadow-sm mr-6 active-scale">
                                <Icon name="chevron-left" />
                            </button>
                            <h1 className="text-3xl font-bold">阅读成就统计</h1>
                        </header>
                        <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                            <div className="bg-white dark:bg-stone-800 p-8 rounded-[2.5rem] shadow-sm border dark:border-stone-700">
                                <p className="text-stone-400 text-xs font-bold uppercase tracking-widest mb-2">藏书总数</p>
                                <p className="text-5xl font-extrabold">{stats.total}</p>
                            </div>
                            <div className="bg-white dark:bg-stone-800 p-8 rounded-[2.5rem] shadow-sm border dark:border-stone-700">
                                <p className="text-stone-400 text-xs font-bold uppercase tracking-widest mb-2">已读完</p>
                                <p className="text-5xl font-extrabold text-emerald-500">{stats.read}</p>
                            </div>
                            <div className="bg-white dark:bg-stone-800 p-8 rounded-[2.5rem] shadow-sm border dark:border-stone-700">
                                <p className="text-stone-400 text-xs font-bold uppercase tracking-widest mb-2">累计字数</p>
                                <p className="text-5xl font-extrabold text-amber-500">{stats.totalWords}</p>
                            </div>
                        </div>
                        <div className="max-w-4xl mx-auto bg-stone-900 text-stone-400 p-10 rounded-[3rem] text-center">
                            <Icon name="sparkles" className="w-12 h-12 text-amber-400 mx-auto mb-6" />
                            <h3 className="text-xl font-bold text-white mb-2">保持阅读，让灵魂更有深度</h3>
                            <p className="italic text-sm">“阅读不是为了逃避生活，而是为了更好地生活。”</p>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // 自动初始化图标
        const iconTimer = setInterval(() => {
            if (window.lucide) {
                lucide.createIcons();
                clearInterval(iconTimer);
            }
        }, 200);
    </script>
</body>
</html>
