<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>云端书房 | 极致美学旗舰版</title>
    
    <!-- PWA 核心配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="云端书房">
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide/book-marked.svg?color=%23111111">
    
    <!-- 加载依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK 模块 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        // 挂载到全局，供 React 使用
        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, doc, setDoc, onSnapshot, query, deleteDoc, orderBy };
        // 触发自定义事件，通知 React Firebase 已就绪
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Noto+Serif+SC:wght@200;500;700;900&display=swap');
        
        :root {
            --bg: #F8F7F2;
            --ink: #1A1A1A;
            --border: #E2E0D5;
            --accent: #8C7E6A;
        }

        body { 
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            /* 适配手机刘海和底部安全区 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        .serif { font-family: 'Noto Serif SC', serif; }
        .hairline { border: 0.5px solid var(--border); }
        .hairline-b { border-bottom: 0.5px solid var(--border); }

        /* 移动端性能优化：减少模糊滤镜开销 */
        .glass-mobile {
            background-color: rgba(248, 247, 242, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .book-cover {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
            background-color: #fff;
            border: 0.5px solid var(--border);
            will-change: transform; /* 启用 GPU 加速 */
        }
        
        @media (min-width: 768px) {
            .book-cover:hover { transform: translateY(-8px); box-shadow: 0 40px 80px rgba(0,0,0,0.08); }
        }

        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .heat-0 { background-color: #E2E0D5; }
        .heat-1 { background-color: #D9C5B2; }
        .heat-2 { background-color: #8C7E6A; }
        .heat-3 { background-color: #1A1A1A; }

        .dark { --bg: #121212; --ink: #E2E0D5; --border: #2A2A2A; --accent: #A39684; }
        .dark .glass-mobile { background-color: rgba(18, 18, 18, 0.9); }

        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 响应式列表优化 */
        .discover-columns {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 768px) { .discover-columns { column-count: 2; } }
        @media (min-width: 1024px) { .discover-columns { column-count: 3; } }
    </style>
</head>
<body>
    <div id="root">
        <!-- 初始加载状态，防止脚本解析时完全空白 -->
        <div class="flex items-center justify-center min-h-screen bg-[#F8F7F2]">
            <div class="text-center">
                <div class="text-stone-300 serif italic text-xl animate-pulse">正在整理书房...</div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef, memo } = React;

        // --- 核心配置 ---
        const apiKey = ""; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'zen-library-pro-v4';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        // --- 图标组件 ---
        const Icon = memo(({ name, className = "w-4 h-4", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const lucideName = name.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
                    const iconElement = lucide.createElement(lucide[lucideName] || lucide[name] || lucide.Book);
                    iconRef.current.appendChild(iconElement);
                }
            }, [name]);
            return <i ref={iconRef} className={className} {...props}></i>;
        });

        const callAI = async (prompt, system, isGrounding = false) => {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: system }] }
                };
                if (isGrounding) payload.tools = [{ "google_search": {} }];
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "AI 暂时没有回应...";
            } catch (err) {
                return "服务连接失败";
            }
        };

        // ----------------------------------------------------------------------
        // 主程序
        // ----------------------------------------------------------------------
        function App() {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [books, setBooks] = useState([]);
            const [publicBooks, setPublicBooks] = useState([]);
            const [view, setView] = useState('shelf');
            const [activeBook, setActiveBook] = useState(null);
            const [tab, setTab] = useState('notes');
            const [isDark, setIsDark] = useState(false);
            const [isLoading, setIsLoading] = useState(false);

            // 监听 Firebase 是否准备好
            useEffect(() => {
                const checkFirebase = () => {
                    if (window.FirebaseSDK) {
                        setIsReady(true);
                        initializeAuth();
                    }
                };
                window.addEventListener('firebase-ready', checkFirebase);
                checkFirebase(); // 立即检查一次
                return () => window.removeEventListener('firebase-ready', checkFirebase);
            }, []);

            const initializeAuth = async () => {
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseSDK;
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);

                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) { console.error(e); }

                onAuthStateChanged(auth, setUser);
            };

            // 监听数据
            useEffect(() => {
                if (!user || !isReady) return;
                const { getFirestore, collection, onSnapshot } = window.FirebaseSDK;
                const db = getFirestore();

                const unsubPrivate = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'books'), (snap) => {
                    setBooks(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubPublic = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'shared_books'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setPublicBooks(data.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
                });

                return () => { unsubPrivate(); unsubPublic(); };
            }, [user, isReady]);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', isDark);
            }, [isDark]);

            const handleSave = async () => {
                if (!activeBook.title.trim() || !user) return;
                const { getFirestore, doc, setDoc } = window.FirebaseSDK;
                const db = getFirestore();
                const bookData = { ...activeBook, updatedAt: Date.now(), userId: user.uid };
                
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'books', activeBook.id), bookData);
                if (activeBook.isPublic) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_books', activeBook.id), bookData);
                }
                setView('shelf');
            };

            const handleAiAnalysis = async () => {
                if (activeBook.content.length < 5) return;
                setIsLoading(true);
                const res = await callAI(activeBook.content, "你是一位顶尖的文学评论家，请深度析评这段笔记，提炼核心洞察并给出人生启发。");
                setActiveBook(p => ({ ...p, content: p.content + "\n\n[ 智库深度析评 ]\n" + res }));
                setIsLoading(false);
            };

            const heatmapData = useMemo(() => {
                const data = Array(90).fill(0);
                const now = new Date();
                books.forEach(b => {
                    const diff = Math.floor((now - new Date(b.updatedAt)) / (1000 * 60 * 60 * 24));
                    if (diff >= 0 && diff < 90) data[89 - diff] += 1;
                });
                return data;
            }, [books]);

            if (!isReady) return null;

            return (
                <div className="min-h-screen">
                    {/* 手机端吸顶导航 */}
                    <nav className="fixed top-0 w-full h-16 md:h-20 px-4 md:px-8 flex justify-between items-center glass-mobile z-50 hairline-b">
                        <div className="flex items-center gap-4 md:gap-10">
                            <h2 className="text-xl md:text-2xl font-black serif italic tracking-tighter cursor-pointer" onClick={() => setView('shelf')}>Archives.</h2>
                            <div className="hidden sm:flex gap-6 text-[10px] font-black uppercase tracking-widest text-stone-400">
                                <button onClick={() => setView('shelf')} className={view === 'shelf' ? 'text-black dark:text-white' : ''}>馆藏</button>
                                <button onClick={() => setView('discover')} className={view === 'discover' ? 'text-black dark:text-white' : ''}>广场</button>
                                <button onClick={() => setView('stats')} className={view === 'stats' ? 'text-black dark:text-white' : ''}>指标</button>
                            </div>
                        </div>
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setIsDark(!isDark)} className="opacity-40 active-scale"><Icon name={isDark ? 'sun' : 'moon'} /></button>
                            <button onClick={() => {
                                const id = Date.now().toString();
                                setActiveBook({ id, title: '', author: '', content: '', quotes: '', isPublic: false, status: '想读' });
                                setTab('notes'); setView('editor');
                            }} className="bg-black dark:bg-white text-white dark:text-black px-4 py-1.5 rounded-full text-[10px] font-black uppercase active-scale">
                                增补
                            </button>
                        </div>
                    </nav>

                    {/* 移动端底部导航占位 (仅手机显示) */}
                    <div className="sm:hidden fixed bottom-0 left-0 w-full glass-mobile hairline-t flex justify-around py-3 z-50">
                        <button onClick={() => setView('shelf')} className={`p-2 ${view === 'shelf' ? 'text-black dark:text-white' : 'text-stone-300'}`}><Icon name="home" /></button>
                        <button onClick={() => setView('discover')} className={`p-2 ${view === 'discover' ? 'text-black dark:text-white' : 'text-stone-300'}`}><Icon name="compass" /></button>
                        <button onClick={() => setView('stats')} className={`p-2 ${view === 'stats' ? 'text-black dark:text-white' : 'text-stone-300'}`}><Icon name="bar-chart-2" /></button>
                    </div>

                    <main className="pt-20 md:pt-32 pb-24 md:pb-20 px-4 md:px-8 max-w-6xl mx-auto">
                        
                        {view === 'shelf' && (
                            <div className="animate-fade">
                                <div className="mb-10 md:mb-20">
                                    <h3 className="text-3xl md:text-5xl font-black serif italic tracking-tighter mb-2 md:mb-4">Personal domain.</h3>
                                    <p className="text-stone-400 text-[10px] md:text-xs font-medium uppercase tracking-widest">每一行文字都是灵魂的存证。</p>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-16">
                                    {books.length === 0 ? (
                                        <div className="col-span-full py-32 border hairline border-dashed text-center rounded-3xl opacity-50">尚未动笔</div>
                                    ) : books.map(book => (
                                        <div key={book.id} onClick={() => { setActiveBook(book); setView('editor'); }} className="group cursor-pointer">
                                            <div className="aspect-[3/4] book-cover p-6 md:p-10 flex flex-col justify-between mb-4 relative overflow-hidden dark:bg-stone-900">
                                                <div className="w-8 h-px bg-stone-200"></div>
                                                <h4 className="text-xl md:text-3xl serif font-bold leading-tight line-clamp-3">{book.title || "无题"}</h4>
                                                <div className="flex justify-between items-end">
                                                    <p className="text-[9px] uppercase font-bold text-stone-400 truncate max-w-[80%]">{book.author || "佚名"}</p>
                                                    {book.isPublic && <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'discover' && (
                            <div className="animate-fade">
                                <div className="mb-10 md:mb-20">
                                    <h3 className="text-3xl md:text-5xl font-black serif italic tracking-tighter mb-2">Discovery.</h3>
                                    <p className="text-stone-400 text-[10px] md:text-xs font-medium uppercase tracking-widest">在这里，邂逅思想的微光。</p>
                                </div>
                                <div className="discover-columns">
                                    {publicBooks.map(book => (
                                        <div key={book.id} className="mb-6 md:mb-10 p-6 md:p-10 bg-white dark:bg-stone-900 border hairline break-inside-avoid shadow-sm">
                                            <h4 className="text-lg md:text-2xl serif font-bold mb-3 italic">《{book.title}》</h4>
                                            <p className="text-xs md:text-sm leading-relaxed text-stone-500 line-clamp-6 mb-6 serif">{book.content}</p>
                                            <div className="pt-4 border-t border-stone-50 dark:border-stone-800 flex justify-between items-center">
                                                <span className="text-[8px] font-black text-stone-300 uppercase">CONTRIBUTOR #{book.userId?.slice(-4)}</span>
                                                <Icon name="heart" className="text-stone-200" />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'editor' && (
                            <div className="animate-fade max-w-2xl mx-auto">
                                <header className="flex justify-between items-center mb-10">
                                    <button onClick={() => setView('shelf')} className="text-[10px] font-black uppercase text-stone-400 active-scale flex items-center gap-1"><Icon name="arrow-left" /> 返回</button>
                                    <div className="flex gap-4 items-center">
                                        <label className="flex items-center gap-2 cursor-pointer text-stone-300">
                                            <input type="checkbox" checked={activeBook.isPublic} onChange={e => setActiveBook({...activeBook, isPublic: e.target.checked})} className="w-3 h-3 accent-black" />
                                            <span className="text-[9px] font-black uppercase">公开同步</span>
                                        </label>
                                        <button onClick={handleSave} className="bg-black dark:bg-white text-white dark:text-black px-6 py-2 rounded-full text-[10px] font-black uppercase active-scale">存证</button>
                                    </div>
                                </header>
                                <input className="text-4xl md:text-6xl font-black serif italic tracking-tighter w-full bg-transparent border-none outline-none mb-8" placeholder="Title." value={activeBook.title} onChange={e => setActiveBook({...activeBook, title: e.target.value})} />
                                <div className="flex items-center gap-4 mb-10 border-b hairline pb-4">
                                    <input className="text-xs font-medium uppercase text-stone-400 bg-transparent border-none outline-none w-full" placeholder="Author" value={activeBook.author} onChange={e => setActiveBook({...activeBook, author: e.target.value})} />
                                    <button onClick={handleAiAnalysis} disabled={isLoading} className="shrink-0 text-[9px] font-black uppercase border-b border-black active-scale opacity-50">
                                        {isLoading ? '...' : '深度析评'}
                                    </button>
                                </div>
                                <textarea className="w-full h-[60vh] bg-transparent border-none outline-none text-lg leading-[1.8] serif resize-none placeholder-stone-200" placeholder="在此落笔..." value={activeBook.content} onChange={e => setActiveBook({...activeBook, content: e.target.value})} />
                                <div className="mt-10 py-6 border-t hairline flex justify-between">
                                    <button onClick={() => { if(confirm('确定销毁？')) { window.FirebaseSDK.deleteDoc(window.FirebaseSDK.doc(window.FirebaseSDK.getFirestore(), 'artifacts', appId, 'users', user.uid, 'books', activeBook.id)); setView('shelf'); } }} className="text-[9px] font-black uppercase text-red-300">销毁档案</button>
                                    <span className="text-[8px] font-bold text-stone-200 uppercase">PRO MAX Edition</span>
                                </div>
                            </div>
                        )}
                        
                        {view === 'stats' && (
                            <div className="animate-fade">
                                <h3 className="text-3xl md:text-5xl font-black serif italic mb-10">Metrics.</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 text-center">
                                    <div className="p-8 border hairline rounded-3xl">
                                        <p className="text-[10px] font-black uppercase text-stone-400 mb-2">Collections</p>
                                        <p className="text-5xl font-black serif italic">{books.length}</p>
                                    </div>
                                    <div className="p-8 border hairline rounded-3xl">
                                        <p className="text-[10px] font-black uppercase text-stone-400 mb-2">Total Words</p>
                                        <p className="text-5xl font-black serif italic">{books.reduce((a, b) => a + (b.content?.length || 0), 0)}</p>
                                    </div>
                                    <div className="p-8 bg-black text-white dark:bg-white dark:text-black rounded-3xl">
                                        <p className="text-[10px] font-black uppercase opacity-50 mb-2">Global Rank</p>
                                        <p className="text-5xl font-black serif italic">Top 1%</p>
                                    </div>
                                </div>
                                <div className="p-8 border hairline rounded-[2.5rem]">
                                    <h5 className="text-[9px] font-black uppercase text-stone-400 mb-8 flex items-center gap-2"><Icon name="activity" /> 脑力活跃矩阵</h5>
                                    <div className="flex flex-wrap gap-2">
                                        {heatmapData.map((count, i) => (
                                            <div key={i} className={`w-3.5 h-3.5 rounded-sm ${count >= 3 ? 'heat-3' : count >= 2 ? 'heat-2' : count >= 1 ? 'heat-1' : 'heat-0'}`}></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 悬浮工具 */}
                    <div className="fixed bottom-20 sm:bottom-10 right-6 z-[100] flex flex-col gap-4 no-print">
                        <button onClick={() => window.print()} className="w-12 h-12 glass-mobile hairline rounded-full flex items-center justify-center active-scale shadow-lg"><Icon name="printer" /></button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
